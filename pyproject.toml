[project]
name = "gemini-pycli"
version = "0.1.0"
description = "A PostgreSQL-backed streaming Gemini CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.67.0,<2",
    "prompt-toolkit>=3.0.51,<4",
    "psycopg[binary]>=3.2.9,<4",
    "python-dotenv>=1.1.1,<2",
    "rich>=14.1.0,<15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1,<9",
]

[project.scripts]
gemini-cli = "gemini_cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_cli"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

